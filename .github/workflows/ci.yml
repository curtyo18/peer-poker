name: CI

# Guards master from both directions: every pull request into it, and any push that lands on
# it directly. deploy.yml only runs `npm run build`, so without this nothing on a runner ever
# executes the tests or the linter.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches deploy.yml, so what CI verifies is the runtime that actually ships.
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # `build` is `tsc -b && vite build`, so this is the typecheck as well as the bundle.
      - run: npm run build
